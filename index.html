<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Idioma: ?lang=en (enlaces antiguos) o preferencia guardada → /en/, antes de pintar nada
      try {
        var b = '%BASE_URL%', p = location.pathname, q = new URLSearchParams(location.search).get('lang')
        if ((p === b || p === b + 'index.html') && (q === 'en' || (!q && localStorage.getItem('gc-lang') === 'en')))
          location.replace(b + 'en/' + location.hash)
      } catch (e) {}
    </script>
    <!--app-head-->
    <title>G&amp;C Pinturas · Pintores en Elche, Santa Pola, Gran Alacant y Vega Baja</title>
    <meta
      name="description"
      content="Pintura profesional para viviendas, apartamentos turísticos y propiedades en Elche, Santa Pola, Gran Alacant y Vega Baja. Presupuesto gratis y sin compromiso."
    />
    <!--/app-head-->
    <meta name="theme-color" content="#fbfbf8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/media/hero-poster.webp" fetchpriority="high" />
    <noscript><style>[data-reveal] { opacity: 1 !important; translate: none !important; }</style></noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
